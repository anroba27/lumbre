:root {
  color-scheme: dark;
  --fondo: #08090a; --panel: #0f1011; --superficie: #141516; --superficie-2: #191a1b; --superficie-3: #1c1c1f;
  --tinta: #f7f8f8; --tinta-2: #d0d6e0; --tinta-3: #8a8f98; --tinta-4: #62666d;
  --filete: rgba(255,255,255,.08); --filete-suave: rgba(255,255,255,.05); --filete-fuerte: rgba(255,255,255,.14);
  --velo: rgba(255,255,255,.04); --velo-2: rgba(255,255,255,.07);
  --acento: #e3a14a; --acento-vivo: #f0b566; --acento-tinte: rgba(227,161,74,.12); --acento-filete: rgba(227,161,74,.38);
  --boton: #e6e6e7; --boton-hover: #fff; --sobre-boton: #08090a;
  /* Gráficos. Paleta categórica de las 8 categorías, en este orden fijo (casa → formación). Validada con dataviz/validate_palette.js
     sobre #0f1011 y #141516: banda de luminosidad, croma ≥ 0,10, contraste ≥ 3:1, vecinas (también la última con la primera)
     ΔE CVD ≥ 9,5 y ΔE normal ≥ 17,0. Entre todas las parejas, la peor ΔE normal es 11,7. A ≥ 20 de ΔE del ámbar, que no entra: es el acento. */
  --c-casa: #7959ab; --c-telefonia: #1895c9; --c-suscripciones: #b1668d; --c-seguros: #607023;
  --c-transporte: #006e9f; --c-salud: #4f9c5e; --c-compras: #9580d7; --c-formacion: #a14b40;
  --c-otros: #6b7079; --c-ingreso: #d0d6e0; --c-revisar: #4a4e56;
  --n-fuerte: #d0d6e0; --n-medio: #6b7079; --n-flojo: #2c2e33;
  --rejilla: rgba(255,255,255,.06); --eje: rgba(255,255,255,.16);
  --f: "LumbreInter", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --ease-out: cubic-bezier(.19,1,.22,1); --ease-suave: cubic-bezier(.25,.46,.45,.94); --ease-in-out: cubic-bezier(.77,0,.175,1);
  --r-6: 6px; --r-8: 8px; --r-12: 12px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--fondo); -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--fondo); color: var(--tinta-2); font-family: var(--f); font-size: 15px; line-height: 1.6;
  letter-spacing: -0.011em; font-feature-settings: "cv01", "ss03"; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
::selection { background: rgba(227,161,74,.3); color: var(--tinta); }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; letter-spacing: inherit; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }
.oculto { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html { scrollbar-color: #2c2e33 transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2c2e33; border-radius: 10px; border: 2px solid var(--fondo); }
::-webkit-scrollbar-track { background: transparent; }

.pagina { max-width: 1200px; margin: 0 auto; padding: 0 24px 64px; }

/* Barra superior */
.barra { position: sticky; top: 0; z-index: 20; background: rgba(8,9,10,.82); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--filete-suave); }
.barra-dentro { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 16px; }
.logo { display: block; width: 92px; height: auto; color: var(--tinta); overflow: visible; }
.logo .tachado, .logo .subrayado { stroke: currentColor; stroke-width: .9; }
.logo .punto { fill: var(--acento); }
.barra-migas { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tinta-3); letter-spacing: 0; }
.barra-migas svg { width: 14px; height: 14px; stroke: var(--tinta-4); fill: none; stroke-width: 1.5; }
.barra-migas b { font-weight: 510; color: var(--tinta-2); }
.barra .boton { margin-left: auto; }

.boton { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 9999px; border: 1px solid var(--filete-fuerte);
  background: transparent; color: var(--tinta-2); font-size: 13px; font-weight: 510; letter-spacing: 0; cursor: pointer; white-space: nowrap;
  transition: background-color 100ms var(--ease-suave), color 100ms var(--ease-suave), transform 160ms var(--ease-out); }
.boton svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.boton-claro { background: var(--boton); color: var(--sobre-boton); border-color: transparent; }
.boton:active { transform: scale(.97); }
.boton[disabled] { opacity: .5; cursor: default; }
@media (hover: hover) and (pointer: fine) {
  .boton:hover { background: var(--velo-2); color: var(--tinta); }
  .boton-claro:hover { background: var(--boton-hover); color: var(--sobre-boton); }
}

/* Portada */
.portada { padding: 72px 0 40px; position: relative; }
.portada::before { content: ""; position: absolute; inset: -40px 0 auto; height: 340px; pointer-events: none;
  background: radial-gradient(ellipse 34% 46% at 36% 42%, rgba(227,161,74,.05), rgba(227,161,74,0) 100%); }
.titular { font-size: 52px; line-height: 1.08; font-weight: 510; letter-spacing: -0.022em; color: var(--tinta); max-width: 22ch; text-wrap: balance; }
.titular .gris { color: var(--tinta-3); }
.titular span { display: inline; }
.entradilla { margin-top: 20px; max-width: 62ch; font-size: 17px; line-height: 1.55; color: var(--tinta-2); text-wrap: pretty; }
.entradilla b { font-weight: 510; color: var(--tinta); }
.meta { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--tinta-3); letter-spacing: 0; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; }

/* Secciones */
.seccion { padding-top: 56px; }
.seccion-cab { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.seccion-titulo { font-size: 24px; line-height: 1.25; font-weight: 510; letter-spacing: -0.022em; color: var(--tinta); max-width: 64ch; text-wrap: balance; }
.seccion-titulo .gris { color: var(--tinta-3); }
.seccion-cab .boton { margin-left: auto; }

.marco { background: var(--panel); border: 1px solid var(--filete); border-radius: var(--r-12); box-shadow: 0 0 0 2px rgba(0,0,0,.2) inset; min-width: 0; }

/* Antes → después */
.ad { display: grid; grid-template-columns: minmax(0, 1.15fr) 56px minmax(0, 1fr); align-items: stretch; }
.ad-col { padding: 20px; min-width: 0; display: flex; flex-direction: column; }
.ad-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.ad-cab svg { width: 18px; height: 18px; fill: none; stroke: var(--tinta-3); stroke-width: 1.5; flex: none; }
.ad-cab h3 { font-size: 15px; font-weight: 510; color: var(--tinta); letter-spacing: -0.011em; }
.ad-cab p { margin-left: auto; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; text-align: right; }
.ad-flecha { display: grid; place-items: center; }
.ad-flecha svg { width: 28px; height: 28px; fill: none; stroke: var(--tinta-4); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ad-pie { margin-top: auto; padding-top: 16px; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; display: flex; align-items: center; gap: 6px; }
.ad-pie svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; flex: none; }

.pila { display: flex; flex-direction: column; gap: 10px; }
.pila-grupo-nombre { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; margin-bottom: 6px; }
.pila-grupo-nombre svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.pila-fichas { display: flex; flex-wrap: wrap; gap: 4px 4px; padding: 2px 0 0 2px; }
.ficha { display: inline-flex; align-items: center; gap: 6px; max-width: 180px; height: 25px; padding: 0 9px 0 7px; border-radius: 6px;
  background: var(--superficie-2); border: 1px solid var(--filete-fuerte); color: var(--tinta-2); font-size: 12px; letter-spacing: 0; white-space: nowrap;
  transform: translate(var(--dx, 0), var(--dy, 0)) rotate(var(--giro, 0deg)); transition: opacity 160ms var(--ease-suave), color 160ms var(--ease-suave), border-color 160ms var(--ease-suave), background-color 160ms var(--ease-suave); cursor: default; }
.ficha span { overflow: hidden; text-overflow: ellipsis; }
.ficha svg { width: 13px; height: 13px; flex: none; fill: none; stroke: var(--tinta-3); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ficha.copiada { background: transparent; border-color: var(--filete); color: var(--tinta-3); }
.pila.densa .ficha { max-width: 128px; height: 22px; font-size: 11px; padding: 0 7px 0 5px; }
.pila.densa .pila-fichas { gap: 4px; }
.pila.foco .ficha { opacity: .28; }
.pila.foco .ficha.en-foco { opacity: 1; color: var(--tinta); border-color: var(--filete-fuerte); }

.arbol { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 76px; }
.arbol-raiz { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tinta-3); letter-spacing: 0; padding: 0 8px 6px; }
.arbol-raiz svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.carpeta > summary { list-style: none; display: block; border-radius: 8px; cursor: pointer; }
.carpeta .fila { display: grid; grid-template-columns: 14px 10px minmax(0, 1fr) minmax(40px, 30%) 30px; align-items: center; gap: 10px;
  min-height: 34px; padding: 0 8px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--tinta-2); letter-spacing: 0; position: relative; }
.carpeta > summary::-webkit-details-marker { display: none; }
.carpeta > summary .chev { width: 12px; height: 12px; fill: none; stroke: var(--tinta-4); stroke-width: 1.6; transition: transform 160ms var(--ease-out); }
.carpeta[open] > summary .chev { transform: rotate(90deg); }
.carpeta .muestra { width: 10px; height: 10px; border-radius: 3px; }
.carpeta .nombre { font-weight: 510; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta); }
.carpeta .pista { height: 6px; border-radius: 6px; background: var(--velo); overflow: hidden; }
.carpeta .pista i { display: block; height: 100%; border-radius: 6px; transform-origin: 0 50%; transition: transform 240ms var(--ease-out); }
.carpeta .cuenta { text-align: right; font-variant-numeric: tabular-nums; color: var(--tinta); font-weight: 510; }
.carpeta.revisar .nombre { color: var(--tinta-2); }
.carpeta .fila.activa { background: var(--velo-2); }
.carpeta .fila.llega { animation: llega 520ms var(--ease-out); }
@keyframes llega { from { background-color: rgba(255,255,255,.09); } to { background-color: transparent; } }
@media (hover: hover) and (pointer: fine) { .carpeta > summary:hover .fila { background: var(--velo); } }
.carpeta ul { list-style: none; margin: 2px 0 8px 32px; padding: 0 0 0 12px; border-left: 1px solid var(--filete); }
.carpeta li { padding: 5px 0; font-size: 12px; line-height: 1.45; letter-spacing: 0; color: var(--tinta-2); overflow-wrap: anywhere; }
.carpeta li small { display: block; color: var(--tinta-3); font-size: 12px; }
.archivo-extra { display: grid; grid-template-columns: 14px 10px minmax(0,1fr); gap: 10px; align-items: center; min-height: 28px; padding: 0 8px; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; }
.archivo-extra svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; grid-column: 2 / 3; }
.archivo-extra span { grid-column: 3; }
.arbol-sep { height: 1px; background: var(--filete-suave); margin: 8px 8px; }

.vuelo { position: absolute; z-index: 30; left: 0; top: 0; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px;
  background: var(--superficie-3); border: 1px solid var(--filete-fuerte); color: var(--tinta); font-size: 11px; letter-spacing: 0; white-space: nowrap; pointer-events: none; will-change: transform, opacity; }
.vuelo i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.capa-vuelos { position: absolute; left: 0; top: 0; width: 0; height: 0; overflow: visible; z-index: 30; }

/* Cifras clave */
/* Separadores con sombras de 1 px a la izquierda y arriba; el overflow corta las del borde exterior. Vale para cualquier número de cifras. */
.cifras { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); border-top: 1px solid var(--filete); border-bottom: 1px solid var(--filete); overflow: hidden; }
.cifras.una-fila { grid-template-columns: 1.5fr repeat(var(--n, 6), minmax(0, 1fr)); }
.cifra { padding: 20px 20px 22px; min-width: 0; box-shadow: -1px 0 0 var(--filete-suave), 0 -1px 0 var(--filete-suave); }
.cifras:not(.una-fila) .cifra:first-child { grid-column: 1 / -1; }
.cifra dt { font-size: 13px; color: var(--tinta-3); letter-spacing: 0; }
.cifra dd { margin: 6px 0 0; }
.cifra .valor { display: block; font-size: 24px; line-height: 1.15; font-weight: 510; letter-spacing: -0.022em; color: var(--tinta); white-space: nowrap; }
.cifra:first-child .valor { font-size: 40px; letter-spacing: -0.03em; }
.cifra .sub { display: block; margin-top: 6px; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; line-height: 1.4; }
.cifra.juego .valor { color: var(--acento); }

/* Hallazgos */
.hallazgos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.hallazgo { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 18px 20px; border-radius: var(--r-12); background: var(--panel); border: 1px solid var(--filete); cursor: pointer;
  transition: border-color 160ms var(--ease-suave), background-color 160ms var(--ease-suave), transform 160ms var(--ease-out); width: 100%; }
.hallazgo:active { transform: scale(.99); }
.hallazgo.principal { grid-column: 1 / -1; border-color: var(--acento-filete); background: linear-gradient(180deg, rgba(227,161,74,.05), rgba(227,161,74,0) 70%), var(--panel); padding: 22px 24px; }
.hallazgo.activo { border-color: var(--acento); background: var(--acento-tinte); }
@media (hover: hover) and (pointer: fine) { .hallazgo:hover { border-color: var(--filete-fuerte); background-color: var(--superficie); } .hallazgo.principal:hover { border-color: var(--acento); } }
.hallazgo-cab { display: flex; align-items: center; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 9999px; border: 1px solid var(--filete-fuerte); font-size: 12px; font-weight: 510; color: var(--tinta-2); letter-spacing: 0; white-space: nowrap; }
.chip svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.hallazgo .chip svg { stroke: var(--acento); }
.hallazgo-importe { margin-left: auto; font-size: 20px; font-weight: 510; color: var(--tinta); letter-spacing: -0.022em; white-space: nowrap; }
.hallazgo.principal .hallazgo-importe { font-size: 28px; color: var(--acento); }
.hallazgo-titulo { font-size: 17px; line-height: 1.3; font-weight: 510; color: var(--tinta); letter-spacing: -0.015em; text-wrap: balance; }
.hallazgo.principal .hallazgo-titulo { font-size: 24px; letter-spacing: -0.022em; }
.hallazgo-texto { font-size: 14px; line-height: 1.55; color: var(--tinta-2); max-width: 70ch; }
.hallazgo-pie { margin-top: 2px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; }
.hallazgo-pie svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; }

/* Filtro de categorías (uno, encima de todo lo que filtra) */
.filtro { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 16px; }
.filtro-nota { font-size: 12px; color: var(--tinta-3); letter-spacing: 0; margin-left: 6px; }
.pastilla { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px; border-radius: 9999px; border: 1px solid var(--filete); background: transparent;
  color: var(--tinta-3); font-size: 13px; font-weight: 510; letter-spacing: 0; cursor: pointer; transition: background-color 100ms var(--ease-suave), color 100ms var(--ease-suave), border-color 100ms var(--ease-suave), transform 160ms var(--ease-out); }
.pastilla i { width: 8px; height: 8px; border-radius: 2px; flex: none; opacity: .5; }
.pastilla[aria-pressed="true"] { color: var(--tinta); border-color: var(--filete-fuerte); background: var(--velo-2); }
.pastilla[aria-pressed="true"] i { opacity: 1; }
.pastilla:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .pastilla:hover { color: var(--tinta-2); border-color: var(--filete-fuerte); } }

/* Gráficos */
.graficos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grafico { padding: 20px 20px 16px; display: flex; flex-direction: column; }
.grafico.ancho { grid-column: 1 / -1; }
.grafico-cab { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
.grafico-titulo { font-size: 15px; font-weight: 510; color: var(--tinta); letter-spacing: -0.011em; line-height: 1.35; }
.grafico-titulo .gris { color: var(--tinta-3); font-weight: 400; }
.grafico-lectura { margin-top: 4px; font-size: 13px; color: var(--tinta-2); letter-spacing: 0; line-height: 1.5; }
.grafico-lectura b { font-weight: 510; color: var(--tinta); }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 10px; padding: 0; list-style: none; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; }
.leyenda li { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.leyenda i.linea { width: 14px; height: 2px; border-radius: 2px; }
.leyenda i.aro { background: transparent !important; border: 2px solid var(--n-fuerte); border-radius: 50%; width: 10px; height: 10px; }
.leyenda i.punto { width: 6px; height: 6px; border-radius: 50%; margin: 0 2px; }
.lienzo-svg { position: relative; width: 100%; }
.lienzo-svg svg { width: 100%; height: auto; overflow: visible; }
.grafico-nota { margin-top: 10px; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; line-height: 1.45; }
.gemela { margin-top: 12px; border-top: 1px solid var(--filete-suave); padding-top: 8px; }
.gemela > summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; cursor: pointer; padding: 4px 0; border-radius: 4px; }
.gemela > summary::-webkit-details-marker { display: none; }
.gemela > summary svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; transition: transform 160ms var(--ease-out); }
.gemela[open] > summary svg { transform: rotate(90deg); }
@media (hover: hover) and (pointer: fine) { .gemela > summary:hover { color: var(--tinta-2); } }
.gemela-dentro { max-height: 320px; overflow: auto; margin-top: 6px; }
.gemela table { width: 100%; border-collapse: collapse; font-size: 12px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.gemela th { text-align: left; font-weight: 510; color: var(--tinta-3); padding: 4px 8px 4px 0; border-bottom: 1px solid var(--filete); position: sticky; top: 0; background: var(--panel); }
.gemela td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--filete-suave); color: var(--tinta-2); }
.gemela .d { text-align: right; }

svg text { font-family: var(--f); letter-spacing: 0; font-feature-settings: "tnum", "cv01", "ss03"; }
.eje-texto { fill: var(--tinta-3); font-size: 12px; }
.eje-texto.fuerte { fill: var(--tinta); font-weight: 510; }
.rejilla { stroke: var(--rejilla); stroke-width: 1; shape-rendering: crispEdges; }
.base { stroke: var(--eje); stroke-width: 1; shape-rendering: crispEdges; }
.media-linea { stroke: var(--tinta-3); stroke-width: 1; shape-rendering: crispEdges; }
.banda { fill: transparent; cursor: default; outline: none; }
.banda.activa, .banda:focus-visible { fill: var(--velo); }
.banda:focus-visible { stroke: var(--acento); stroke-width: 1.5; }
.marca { transition: opacity 160ms var(--ease-suave); }
.apagado .marca:not(.viva) { opacity: .3; }

/* Reparto */
.segmentada { display: flex; gap: 2px; height: 28px; margin-bottom: 16px; }
.segmentada span { height: 100%; border-radius: 4px; min-width: 2px; transition: opacity 160ms var(--ease-suave); }
.reparto { display: flex; flex-direction: column; gap: 2px; }
.reparto-fila { display: grid; grid-template-columns: 10px minmax(0, 1fr) minmax(60px, 32%) 76px 40px; align-items: center; gap: 10px; min-height: 32px; padding: 0 8px; margin: 0 -8px;
  border: 0; background: transparent; border-radius: 8px; text-align: left; cursor: pointer; font-size: 13px; letter-spacing: 0; color: var(--tinta-2); transition: background-color 100ms var(--ease-suave), opacity 160ms var(--ease-suave); }
.reparto-fila i { width: 10px; height: 10px; border-radius: 3px; }
.reparto-fila > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reparto-fila .barrita { height: 6px; border-radius: 6px; background: var(--velo); overflow: hidden; }
.reparto-fila .barrita b { display: block; height: 100%; border-radius: 6px; }
.reparto-fila .d { text-align: right; font-variant-numeric: tabular-nums; color: var(--tinta); }
.reparto-fila .p { text-align: right; font-variant-numeric: tabular-nums; color: var(--tinta-3); }
.reparto-fila[aria-pressed="false"].hay-filtro { opacity: .45; }
@media (hover: hover) and (pointer: fine) { .reparto-fila:hover { background: var(--velo); } }

/* Pequeños múltiplos */
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.multiple { padding: 14px 14px 10px; border-radius: 10px; background: var(--superficie); border: 1px solid var(--filete-suave); min-width: 0; }
.multiple.sube-mas { border-color: var(--acento-filete); }
.multiple-cab { display: flex; align-items: baseline; gap: 8px; }
.multiple-nombre { font-size: 13px; font-weight: 510; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0; }
.multiple-cambio { margin-left: auto; font-size: 13px; font-weight: 510; color: var(--tinta-3); font-variant-numeric: tabular-nums; letter-spacing: 0; white-space: nowrap; }
.multiple.sube-mas .multiple-cambio { color: var(--acento); }
.multiple-desde { font-size: 12px; color: var(--tinta-3); letter-spacing: 0; font-variant-numeric: tabular-nums; }

/* Calendario */
.calendario { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 18px 16px; }
.mes-nombre { font-size: 12px; font-weight: 510; color: var(--tinta-2); letter-spacing: 0; margin-bottom: 6px; }
.mes-nombre small { color: var(--tinta-3); font-weight: 400; font-size: 12px; margin-left: 4px; }
.mes-dias { display: grid; grid-template-columns: repeat(7, 14px); gap: 3px; }
.dia { width: 14px; height: 14px; border-radius: 3px; background: rgba(255,255,255,.045); }
.dia.hueco { background: transparent; }
.dia.n1 { background: rgba(208,214,224,.28); }
.dia.n2 { background: rgba(208,214,224,.5); }
.dia.n3 { background: rgba(208,214,224,.75); }
.dia.n4 { background: var(--n-fuerte); }
.dia.max { background: var(--acento); }
.dia.con { cursor: default; }
.escala { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; }
.escala .dia { display: inline-block; }

/* Qué se ha leído */
.leido { display: flex; flex-direction: column; gap: 8px; }
.leido-fila { display: grid; grid-template-columns: 16px 74px 26px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 13px; letter-spacing: 0; color: var(--tinta-2); }
.leido-fila > svg { width: 15px; height: 15px; fill: none; stroke: var(--tinta-3); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.leido-fila .d { text-align: right; font-variant-numeric: tabular-nums; color: var(--tinta); font-weight: 510; }
.unidades { display: flex; flex-wrap: wrap; gap: 4px; }
.u { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; }
.u.gasto { background: var(--n-fuerte); }
.u.ingreso { background: var(--n-medio); }
.u.duplicado { border: 2px solid var(--n-fuerte); }
.u.no_factura::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--tinta-3); }
.u.ilegible { position: relative; }
.u.ilegible::before, .u.ilegible::after { content: ""; position: absolute; width: 11px; height: 2px; border-radius: 2px; background: var(--tinta-3); transform: rotate(45deg); }
.u.ilegible::after { transform: rotate(-45deg); }
.tipos { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--filete-suave); font-size: 12px; color: var(--tinta-3); letter-spacing: 0; }
.tipos span { display: inline-flex; align-items: center; gap: 6px; }
.tipos b { color: var(--tinta); font-weight: 510; font-variant-numeric: tabular-nums; }

/* Tabla */
.tabla-controles { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
.buscar { position: relative; flex: 1 1 280px; max-width: 420px; }
.buscar svg { position: absolute; left: 12px; top: 50%; width: 15px; height: 15px; margin-top: -7.5px; fill: none; stroke: var(--tinta-3); stroke-width: 1.5; pointer-events: none; }
.buscar input { width: 100%; height: 36px; padding: 0 12px 0 36px; border-radius: 8px; border: 1px solid var(--filete-fuerte); background: var(--superficie); color: var(--tinta); font: inherit; font-size: 13px; letter-spacing: 0;
  transition: border-color 160ms var(--ease-suave), box-shadow 160ms var(--ease-suave); caret-color: var(--acento); }
.buscar input::placeholder { color: var(--tinta-3); }
.buscar input:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 3px rgba(227,161,74,.12); }
.segmentos { display: inline-flex; padding: 2px; border-radius: 9999px; border: 1px solid var(--filete); background: var(--panel); }
.segmentos button { height: 28px; padding: 0 12px; border-radius: 9999px; border: 0; background: transparent; color: var(--tinta-3); font-size: 12px; font-weight: 510; letter-spacing: 0; cursor: pointer; transition: background-color 100ms var(--ease-suave), color 100ms var(--ease-suave); }
.segmentos button[aria-pressed="true"] { background: var(--superficie-3); color: var(--tinta); }
.tabla-cuenta { margin-left: auto; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.chip-filtro { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 10px; border-radius: 9999px; background: var(--acento-tinte); border: 1px solid var(--acento-filete); color: var(--tinta); font-size: 12px; font-weight: 510; letter-spacing: 0; cursor: pointer; max-width: 100%; }
.chip-filtro span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-filtro svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; flex: none; }
.tabla-marco { overflow: hidden; }
table.docs { width: 100%; border-collapse: collapse; font-size: 13px; letter-spacing: 0; }
.docs thead th { text-align: left; font-weight: 510; font-size: 12px; color: var(--tinta-3); padding: 0; border-bottom: 1px solid var(--filete); background: var(--panel); white-space: nowrap; }
.docs thead th button { display: inline-flex; align-items: center; gap: 4px; width: 100%; height: 40px; padding: 0 12px; border: 0; background: transparent; color: inherit; font-size: 12px; font-weight: 510; cursor: pointer; letter-spacing: 0; }
.docs thead th.d button { justify-content: flex-end; }
.docs thead th button svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.8; opacity: 0; }
.docs thead th[aria-sort] button { color: var(--tinta); }
.docs thead th[aria-sort] button svg { opacity: 1; }
.docs thead th[aria-sort="ascending"] button svg { transform: rotate(180deg); }
.docs thead th.sin-orden { padding: 0 12px; height: 40px; }
.docs td { padding: 11px 12px; border-bottom: 1px solid var(--filete-suave); vertical-align: top; color: var(--tinta-2); }
.docs tbody tr:last-child td { border-bottom: 0; }
.docs td.d { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.docs td.fecha { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--tinta-2); }
.docs .prov { color: var(--tinta); font-weight: 510; }
.docs .conc { color: var(--tinta-3); font-size: 12px; }
.docs .nota { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; font-size: 12px; color: var(--tinta-2); line-height: 1.45; }
.docs .nota svg { width: 13px; height: 13px; flex: none; margin-top: 2px; fill: none; stroke: var(--acento); stroke-width: 1.6; }
.docs .cat { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.docs .cat i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.docs .ruta { font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; min-width: 300px; }
.docs td.c-prov { max-width: 260px; }
.docs .ruta .antes { color: var(--tinta-3); }
.docs .ruta .despues { color: var(--tinta-2); display: flex; gap: 4px; }
.docs .ruta .despues svg { width: 12px; height: 12px; flex: none; margin-top: 3px; fill: none; stroke: var(--tinta-4); stroke-width: 1.6; }
.docs .total { color: var(--tinta); font-weight: 510; }
.docs .negativo { color: var(--tinta); }
.docs tr.atenuada td, .docs tr.atenuada .prov, .docs tr.atenuada .total { color: var(--tinta-3); }
.docs tr.atenuada .total { text-decoration: line-through; text-decoration-color: rgba(138,143,152,.6); }
.docs tr.resaltada td { background: var(--acento-tinte); }
.docs tr.resaltada td:first-child { box-shadow: inset 2px 0 0 var(--acento); }
.etiqueta { display: inline-block; margin-top: 4px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--filete-fuerte); font-size: 11px; font-weight: 510; color: var(--tinta-2); line-height: 18px; }
.tabla-vacia { padding: 32px 16px; text-align: center; font-size: 13px; color: var(--tinta-3); }

/* Pie */
.pie { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--filete-suave); display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; font-size: 12px; color: var(--tinta-3); letter-spacing: 0; line-height: 1.5; }
.pie .logo { width: 64px; color: var(--tinta-3); }
.pie p { max-width: 70ch; }

/* Estado sin datos */
.vacio { min-height: calc(100vh - 56px); display: grid; place-items: center; text-align: center; padding: 48px 0; }
.vacio-dentro { max-width: 440px; }
.vacio-icono { width: 48px; height: 48px; margin: 0 auto 20px; border-radius: 12px; border: 1px solid var(--filete-fuerte); display: grid; place-items: center; background: var(--panel); }
.vacio-icono svg { width: 22px; height: 22px; fill: none; stroke: var(--tinta-3); stroke-width: 1.5; }
.vacio h1 { font-size: 24px; font-weight: 510; color: var(--tinta); letter-spacing: -0.022em; line-height: 1.3; }
.vacio h1 .gris { color: var(--tinta-3); }
.vacio p { margin-top: 12px; font-size: 15px; color: var(--tinta-2); }
.vacio code { font-family: inherit; font-weight: 510; color: var(--tinta); padding: 1px 6px; border-radius: 4px; background: var(--superficie-3); border: 1px solid var(--filete); }

/* Tooltip */
.tip { position: fixed; z-index: 50; left: 0; top: 0; min-width: 160px; max-width: 280px; padding: 10px 12px; border-radius: 10px; background: #1c1d20; border: 1px solid var(--filete-fuerte);
  box-shadow: 0 8px 32px rgba(0,0,0,.45); font-size: 12px; letter-spacing: 0; color: var(--tinta-2); pointer-events: none; opacity: 0; transform: translateY(4px) scale(.98); transform-origin: 50% 100%;
  transition: opacity 125ms var(--ease-out), transform 125ms var(--ease-out); }
.tip.visible { opacity: 1; transform: none; }
.tip.instante { transition-duration: 0ms; }
.tip-cab { color: var(--tinta-3); margin-bottom: 6px; }
.tip-valor { font-size: 15px; font-weight: 510; color: var(--tinta); font-variant-numeric: tabular-nums; letter-spacing: -0.011em; }
.tip-fila { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; line-height: 1.7; }
.tip-fila i { width: 12px; height: 2px; border-radius: 2px; }
.tip-fila b { font-weight: 510; color: var(--tinta); font-variant-numeric: tabular-nums; text-align: right; }
.tip-fila.total { border-top: 1px solid var(--filete); margin-top: 4px; padding-top: 4px; }
.tip-texto { overflow-wrap: anywhere; line-height: 1.45; }
.tip-texto + .tip-texto { margin-top: 4px; }

}

      FORMATOS.filter(function (f) { return B.docs.some(function (d) { return d.formato === f.k; }); }).map(function (f) {
        return [f.n].concat(TIPOS.map(function (t) { return String(B.docs.filter(function (d) { return d.formato === f.k && d.tipo === t.k; }).length); }));
      })));
    return el;
  }

  /* ───────────── Tabla completa ───────────── */
  function tabla() {
    var buscar = h('input', { type: 'search', placeholder: 'Busca proveedor, archivo o concepto', 'aria-label': 'Buscar en la tabla', autocomplete: 'off', spellcheck: 'false' });
    var segs = h('div', { class: 'segmentos', role: 'group', 'aria-label': 'Qué mostrar' });
    [['todo', 'Todo'], ['gasto', 'Gastos'], ['ingreso', 'Ingresos'], ['revisar', 'Para revisar']].forEach(function (p) {
      if (p[0] === 'ingreso' && !C.ingresos.length) return;
      if (p[0] === 'revisar' && !B.docs.some(function (d) { return d.tipo !== 'gasto' && d.tipo !== 'ingreso'; })) return;
      var b = h('button', { type: 'button', 'aria-pressed': p[0] === 'todo' ? 'true' : 'false', 'data-tipo': p[0], text: p[1] });
      b.addEventListener('click', function () { tablaEstado.tipo = p[0]; Array.prototype.forEach.call(segs.children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); pintarFilas(); });
      segs.appendChild(b);
    });
    var cuenta = h('span', { class: 'tabla-cuenta', 'aria-live': 'polite' });
    var chipH = h('span');
    var controles = h('div', { class: 'tabla-controles' }, [h('label', { class: 'buscar' }, [icono('buscar'), buscar]), segs.children.length > 1 ? segs : null, chipH, cuenta]);
    var cols = [
      { k: 'fecha', n: 'Fecha', cl: 'fecha' }, { k: 'proveedor', n: 'Proveedor y concepto', cl: 'c-prov' }, { k: 'cat', n: 'Categoría', cl: 'c-cat' },
      { k: null, n: 'Archivo: antes y ahora', cl: 'c-ruta' }, { k: 'iva', n: 'IVA', cl: 'c-iva d' }, { k: 'total', n: 'Total', cl: 'c-total d' }
    ];
    var ths = [];
    var thead = h('thead', null, h('tr', null, cols.map(function (c) {
      if (!c.k) return h('th', { scope: 'col', class: 'sin-orden', text: c.n });
      var b = h('button', { type: 'button' }, [c.n, icono('orden')]);
      var th = h('th', { scope: 'col', class: c.cl.indexOf(' d') > -1 ? 'd' : null }, b);
      b.addEventListener('click', function () { if (tablaEstado.orden === c.k) tablaEstado.dir *= -1; else { tablaEstado.orden = c.k; tablaEstado.dir = c.k === 'total' || c.k === 'iva' ? -1 : 1; } pintarFilas(); });
      th._k = c.k; ths.push(th);
      return th;
    })));
    var tbody = h('tbody');
    var vacia = h('div', { class: 'tabla-vacia', hidden: true, text: 'Nada coincide con la búsqueda.' });
    var tablaEl = h('table', { class: 'docs' }, [h('caption', { class: 'oculto', text: 'Todos los documentos leídos' }), thead, tbody]);
    var sec = h('section', { class: 'seccion', id: 'tabla', 'aria-labelledby': 't-t' }, [
      h('div', { class: 'seccion-cab' }, h('h2', { class: 'seccion-titulo', id: 't-t' }, ['Todos los papeles. ', h('span', { class: 'gris', text: 'Uno por archivo, con su nombre de antes y el de ahora.' })])),
      controles,
      h('div', { class: 'marco tabla-marco' }, [tablaEl, vacia])
    ]);
    var filasEl = {};
    B.docs.forEach(function (d) {
      var atenuada = d.tipo !== 'gasto' && d.tipo !== 'ingreso';
      var etiqueta = d.tipo === 'duplicado' ? 'Duplicado' + (d.duplicado_de ? ' de ' + d.duplicado_de : '') : d.tipo === 'no_factura' ? 'No es factura' : d.tipo === 'ilegible' ? 'Ilegible' : d.tipo === 'ingreso' ? 'Ingreso' : null;
      var catTxt = d.tipo === 'gasto' ? cat(d.cat).n : d.tipo === 'ingreso' ? 'Ingresos' : 'Para revisar';
      var tr = h('tr', { class: atenuada ? 'atenuada' : null, 'data-id': d.id }, [
        h('td', { class: 'fecha', text: fechaCorta(d.fecha) }),
        h('td', { class: 'c-prov' }, [
          h('div', { class: 'prov', text: d.proveedor || (d.tipo === 'gasto' || d.tipo === 'ingreso' ? 'Sin proveedor' : '—') }),
          d.concepto ? h('div', { class: 'conc', text: d.concepto }) : null,
          etiqueta ? h('span', { class: 'etiqueta', text: etiqueta }) : null,
          d.nota ? h('div', { class: 'nota' }, [icono('nota'), h('span', { text: d.nota })]) : null
        ]),
        h('td', { class: 'c-cat' }, h('span', { class: 'cat' }, [h('i', { style: 'background:' + color(d.tipo === 'gasto' ? d.cat : d.tipo === 'ingreso' ? 'ingreso' : 'revisar') }), catTxt])),
        h('td', { class: 'c-ruta' }, h('div', { class: 'ruta' }, [h('div', { class: 'antes', text: d.original }), h('div', { class: 'despues' }, [icono('flecha'), h('span', { text: (d.nuevo || d.carpeta).replace(/ €/g, NBSP + '€') })])])),
        h('td', { class: 'c-iva d', text: d.iva != null ? eur(d.iva) : '—' }),
        h('td', { class: 'c-total d' }, h('span', { class: 'total', text: d.total != null ? eur(d.total) : '—' }))
      ]);
      filasEl[d.id] = tr;
    });
    function coincide(d, q) {
      if (!q) return true;
      var t = [d.proveedor, d.concepto, d.original, d.nuevo, d.nota, d.numero, d.nif, cat(d.cat).n, fechaCorta(d.fecha)].join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      return q.split(/\s+/).every(function (p) { return t.indexOf(p) > -1; });
    }
    function valorOrden(d, k) {
      if (k === 'fecha') return d.fecha ? d.fecha.iso : '9999';
      if (k === 'proveedor') return (d.proveedor || '~').toLowerCase();
      if (k === 'cat') return (CAT_IDX[d.tipo === 'gasto' ? d.cat : d.tipo === 'ingreso' ? 'ingreso' : 'revisar'] || { i: 99 }).i;
      if (k === 'total') return d.total == null ? -Infinity : d.total;
      if (k === 'iva') return d.iva == null ? -Infinity : d.iva;
      return 0;
    }
    function pintarFilas() {
      var q = tablaEstado.q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
      var ids = tablaEstado.hallazgo ? tablaEstado.hallazgo.ids : null;
      var lista = B.docs.filter(function (d) {
        if (ids) return ids.indexOf(d.id) > -1;
        if (tablaEstado.tipo === 'gasto' && d.tipo !== 'gasto') return false;
        if (tablaEstado.tipo === 'ingreso' && d.tipo !== 'ingreso') return false;
        if (tablaEstado.tipo === 'revisar' && (d.tipo === 'gasto' || d.tipo === 'ingreso')) return false;
        if (hayFiltro() && !(d.tipo === 'gasto' && filtroCats[d.cat])) return false;
        return coincide(d, q);
      });
      var k = tablaEstado.orden, dir = tablaEstado.dir;
      lista.sort(function (a, b) { var va = valorOrden(a, k), vb = valorOrden(b, k); if (va < vb) return -dir; if (va > vb) return dir; return a.orden - b.orden; });
      tbody.textContent = '';
      lista.forEach(function (d) { var tr = filasEl[d.id]; tr.classList.toggle('resaltada', !!ids); tbody.appendChild(tr); });
      ths.forEach(function (th) { if (th._k === k) th.setAttribute('aria-sort', dir > 0 ? 'ascending' : 'descending'); else th.removeAttribute('aria-sort'); });
      vacia.hidden = lista.length > 0;
      vacia.textContent = hayFiltro() && !q ? 'No hay documentos de esas categorías con este filtro.' : 'Nada coincide con la búsqueda.';
      cuenta.textContent = 'Mostrando ' + entero(lista.length) + ' de ' + entero(B.docs.length);
      chipH.textContent = '';
      if (tablaEstado.hallazgo) {
        var chip = h('button', { type: 'button', class: 'chip-filtro', 'aria-label': 'Quitar el filtro del hallazgo' }, [h('span', { text: tablaEstado.hallazgo.titulo }), icono('cerrar')]);
        chip.addEventListener('click', function () { if (tablaEstado.alQuitar) tablaEstado.alQuitar(); tablaApi.hallazgo(null); });
        chipH.appendChild(chip);
      }
    }
    var tq = null;
    buscar.addEventListener('input', function () { clearTimeout(tq); tq = setTimeout(function () { tablaEstado.q = buscar.value; if (tablaEstado.hallazgo) { if (tablaEstado.alQuitar) tablaEstado.alQuitar(); tablaEstado.hallazgo = null; } pintarFilas(); }, 80); });
    tablaApi = {
      hallazgo: function (x, alQuitar) {
        tablaEstado.hallazgo = x; tablaEstado.alQuitar = x ? alQuitar : null;
        if (x) { tablaEstado.q = ''; buscar.value = ''; }
        pintarFilas();
        if (x) sec.scrollIntoView({ behavior: MOVIMIENTO ? 'smooth' : 'auto', block: 'start' });
      }
    };
    redibujar.push(function (porTamaño) { if (!porTamaño) pintarFilas(); });
    pintarFilas();
    return sec;
  }

  /* ───────────── Pie ───────────── */
  function pie() {
    return h('footer', { class: 'pie' }, [
      document.querySelector('.barra .logo').cloneNode(true),
      h('p', { text: 'Este informe vive en tu carpeta: no se publica ni se envía. Claude ha leído ' + plural(B.docs.length, 'archivo', 'archivos') + ' y ha escrito datos.js; las cuentas las hace esta página. Solo suman los gastos y los ingresos; los duplicados y lo que no es factura no suman.' })
    ]);
  }

  /* ───────────── Arranque ───────────── */
  var raiz = document.getElementById('principal');
  var F = window.FACTURAS;
  var roto = !window.__facturasSinArchivo && !(F && typeof F === 'object');
  if (!F || typeof F !== 'object' || !Array.isArray(F.documentos) || !F.documentos.length) { pintarVacio(roto); return; }
  B = normalizar(F);
  if (!B.docs.length) { pintarVacio(false); return; }
  C = calcular(B);
  document.getElementById('imprimir').hidden = false;
  document.getElementById('imprimir').addEventListener('click', function () { revelarTodo(); window.print(); });
  pintar();
})();
